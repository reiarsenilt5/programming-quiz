name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Nivel de logging de Gradle (info, debug, lifecycle)'
        required: false
        default: 'info'
        type: choice
        options:
          - 'info'
          - 'debug'
          - 'lifecycle'

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Configurar Gradle Oficial
        uses: gradle/actions/setup-gradle@v3

      - name: 🛡️ Configurar y asegurar Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generando Gradle wrapper 8.6..."
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x gradlew

      - name: ⚙️ Configurar local.properties y variables de entorno
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          touch local.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          if [ -n "${GEMINI_API_KEY}" ]; then
            echo "gemini.api.key=${GEMINI_API_KEY}" >> local.properties
          fi

      - name: 🔍 Diagnóstico previo del entorno
        run: |
          echo "=== ENTORNO DE COMPILACIÓN ==="
          java -version
          echo "ANDROID_HOME: $ANDROID_HOME"
          ./gradlew --version

      - name: 🔨 Compilar APK Debug con Logging Detallado
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GRADLE_LOG_LEVEL: ${{ inputs.log_level || 'info' }}
        run: |
          echo "================================================================="
          echo "🚀 INICIANDO COMPILACIÓN GRADLE CON LOGGING DETALLADO"
          echo "Nivel seleccionado: --${GRADLE_LOG_LEVEL}"
          echo "Flags: --${GRADLE_LOG_LEVEL} --full-stacktrace --warning-mode all --no-daemon"
          echo "================================================================="
          ./gradlew assembleDebug --${GRADLE_LOG_LEVEL} --full-stacktrace --warning-mode all --no-daemon

      - name: 📋 Diagnóstico y extracción de errores (si la compilación falla)
        if: failure()
        run: |
          echo "================================================================="
          echo "❌ ERROR DETECTADO DURANTE LA COMPILACIÓN DE GRADLE"
          echo "================================================================="
          echo "--- 1. Reportes y archivos de log generados en app/build/reports ---"
          if [ -d "app/build/reports" ]; then
            find app/build/reports -type f -exec echo ">>> Archivo: {}" \; -exec head -n 120 {} \;
          else
            echo "No se encontró el directorio app/build/reports"
          fi
          
          echo "--- 2. Logs recientes del Gradle Daemon (~/.gradle/daemon) ---"
          if [ -d "$HOME/.gradle/daemon" ]; then
            find "$HOME/.gradle/daemon" -type f -name "*.log" -exec echo ">>> Daemon log: {}" \; -exec tail -n 100 {} \;
          fi

          echo "--- 3. Búsqueda de logs de fallo JVM o crashes ---"
          find . -maxdepth 2 -name "hs_err_pid*.log" -exec echo ">>> JVM Crash Log: {}" \; -exec head -n 50 {} \; 2>/dev/null || true
          echo "================================================================="

      - name: 📦 Subir Reportes de Fallo como Artifact (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            app/build/reports/
            **/build/reports/
            ~/.gradle/daemon/*.log
          retention-days: 7

      - name: 🏷️ Preparar APK con versión para Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "DevQuiz-v1.0.${{ github.run_number }}-debug.apk"
          ls -lh DevQuiz-v1.0.${{ github.run_number }}-debug.apk

      - name: 📦 Subir APK Debug a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevQuiz-APK-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🚀 Crear GitHub Release con APK descargable
        uses: softprops/action-gh-release@v2
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "DevQuiz APK v1.0.${{ github.run_number }}"
          body: |
            ## 📱 DevQuiz Android APK
            Compilación automatizada #${{ github.run_number }} generada exitosamente desde GitHub Actions.
            
            ### 📥 Descarga Directa:
            Descarga el archivo adjunto **DevQuiz-v1.0.${{ github.run_number }}-debug.apk** e instálalo en tu dispositivo Android.
            
            - **Versión**: `1.0.${{ github.run_number }}`
            - **Rama**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            - **Categorías**: 13 cuestionarios técnicos (SOLID, SQL, Fullstack Senior 2026, DevOps & Cloud 2026, Sutilezas Pro, Docker Mastery 25+, etc.)
            - **Modo**: 100% Funcional Offline (IA Gemini opcional)
            - **Logging**: Configurado con nivel exhaustivo para trazabilidad completa.
          files: |
            DevQuiz-v1.0.${{ github.run_number }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
